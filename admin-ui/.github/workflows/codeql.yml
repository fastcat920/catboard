# CodeQL 代码扫描：前端与脚本（JavaScript / TypeScript）、workflow 文件本身（Actions）。结果在仓库的 Security → Code scanning。
# 使用本文件时不要再在仓库设置里开 CodeQL 的 Default setup（两者冲突）
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每周一 03:17（UTC）
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
