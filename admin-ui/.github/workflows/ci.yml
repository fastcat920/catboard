# 检查：push 到 main、提 PR 时执行 pnpm check（类型检查、oxlint、测试、构建）
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同一分支有新的提交时，取消还在跑的旧检查
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # pnpm 的版本取 package.json 的 packageManager
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
